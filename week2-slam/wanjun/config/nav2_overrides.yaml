# Personal changes relative to config/nav2_params.yaml.
# The submission launch merges these into the local baseline at runtime.
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.18
      vx_min: -0.18
    general_goal_checker:
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
velocity_smoother:
  ros__parameters:
    max_velocity: [0.18, 0.0, 2.0]
    min_velocity: [-0.18, 0.0, -2.0]
